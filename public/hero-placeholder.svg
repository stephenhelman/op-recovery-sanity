<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Golden-hour property placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c987"/>
      <stop offset="45%" stop-color="#e39b5a"/>
      <stop offset="100%" stop-color="#8a5a37"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a2f"/>
      <stop offset="100%" stop-color="#3d2a1b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1120" cy="300" r="150" fill="#fbe3b3" opacity="0.7"/>
  <rect y="640" width="1600" height="260" fill="url(#ground)"/>
  <!-- simple house silhouette -->
  <g fill="#2c1d12" opacity="0.85">
    <rect x="620" y="470" width="360" height="200"/>
    <polygon points="600,470 800,360 1000,470"/>
    <rect x="700" y="560" width="70" height="110"/>
    <rect x="840" y="520" width="80" height="70"/>
  </g>
</svg>
